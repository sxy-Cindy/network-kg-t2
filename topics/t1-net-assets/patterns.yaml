entity_patterns:
- type: Device
  regex: (?m)^\s*hostname\s+([\w.-]+)
  id_template: dev:{1}
  label_template: '{1}'
- type: Device
  regex: \b(SW|RT|FW|LB)[-_]?([A-Z0-9]{2,})[-_]([A-Z0-9]+)\b
  id_template: dev:{1}-{2}-{3}
  label_template: '{1}-{2}-{3}'
- type: Interface
  regex: \b((?:Gi|Te|Fa|Eth|GE|XGE|Vlanif|Loopback)[\w./:-]*\d)\b
  id_template: if:{doc}:{1}
  label_template: '{1}'
  flags:
  - IGNORECASE
- type: IPSubnet
  regex: \b((?:\d{1,3}\.){3}\d{1,3}/\d{1,2})\b
  id_template: net:{1}
  label_template: '{1}'
- type: IPAddress
  regex: \b((?:\d{1,3}\.){3}\d{1,3})(?![/\d])
  id_template: ip:{1}
  label_template: '{1}'
- type: VLAN
  regex: (?i)\bvlan\s*(\d{1,4})\b
  id_template: vlan:{1}
  label_template: VLAN {1}
- type: Incident
  regex: (?i)\b(INC[-_]?\d{3,8})\b
  id_template: inc:{1}
  label_template: '{1}'
relations:
- name: connects_to
  relation: connects_to
  source_type: Interface
  target_type: Interface
  trigger: (?i)\bconnect|uplink|链路|对接|互联|直连\b
- name: affected_by
  relation: affected_by
  source_type: Device
  target_type: Incident
  trigger: (?i)\b(impact|outage|故障|中断|受影响|告警)\b
- name: has_subnet
  relation: has_subnet
  source_type: Interface
  target_type: IPSubnet
  trigger: (?i)\b(ip address|gateway|网段|地址)\b
- name: runs
  relation: runs
  source_type: Device
  target_type: Service
  trigger: (?i)\b(running|running-config|启用|服务)\b
structural:
  mentioned_in: true
